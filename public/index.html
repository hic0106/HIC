<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HIC Trading Terminal</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="/css/terminal.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><b>HIC</b><span>선물 자동매매</span></div>
  <div class="view-switch" id="viewSwitch"><button data-view="terminal" class="on">트레이딩</button><button data-view="portfolio">내 자산</button><button data-view="backtest">백테스트</button></div>

  <div class="mode-block">
    <div id="modeBadge" class="mode-badge paper">모의투자</div>
    <div id="runBadge" class="run-badge stopped">STOPPED</div>
    <div class="mode-switch" id="modeSwitch">
      <button data-mode="PAPER">모의</button><button data-mode="LIVE">실전</button>
    </div>
  </div>

  <div class="kpi-main">
    <div class="kpi xl"><label>총 자산 <i id="kEqCcy">USDT</i></label><div id="kEquity">—</div></div>
    <div class="kpi xl"><label>오늘 손익 <i>09시 기준</i></label><div id="kToday">—</div><small id="kTodayPct"></small></div>
    <div class="kpi xl"><label>총 수익률</label><div id="kReturn">—</div><small id="kBase"></small></div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><label>주문 가능</label><div id="kAvail">—</div></div>
    <div class="kpi"><label>투자 중</label><div id="kInvested">—</div></div>
    <div class="kpi"><label>누적 손익</label><div id="kTotalPnl">—</div></div>
    <div class="kpi"><label>롱 규모</label><div id="kLong" class="up">—</div></div>
    <div class="kpi"><label>숏 규모</label><div id="kShort" class="down">—</div></div>
    <div class="kpi"><label>순 노출</label><div id="kNet">—</div></div>
  </div>

  <div class="status-grid">
    <div><label>시세</label><span id="sMarket" class="dot">—</span></div>
    <div><label>거래소</label><span id="sExchange" class="dot">—</span></div>
    <div><label>봇</label><span id="sBot" class="dot">—</span></div>
    <div><label>갱신</label><span id="sLast">—</span></div>
    <div><label>포지션 대조</label><span id="sRecon" class="dot off">—</span></div>
    <div><label>손절 감시</label><span id="sRisk" class="dot off">—</span></div>
  </div>

  <div class="actions">
    <button id="btnStart" class="btn start">▶ 봇 시작</button>
    <button id="btnStop" class="btn stop">■ 봇 전체 정지</button>
    <button id="btnCloseAll" class="btn danger">전체 포지션 청산</button>
    <button id="btnApi" class="btn ghost" title="Binance API 키">⚙ API 키</button>
  </div>
</header>

<main id="grid">
  <aside id="watchlist" class="panel">
    <div class="panel-h">관심 종목 <span class="muted">USDT 무기한 선물</span></div>
    <div id="wlBody"></div>
    <div class="panel-h sub">종목별 투자 규모</div>
    <table class="t compact" id="expTable"></table>
  </aside>

  <section id="center">
    <div id="chartToolbar">
      <span id="ctSymbol" class="ct-sym">BTCUSDT</span>
      <span id="ctPrice" class="ct-price">—</span>
      <span id="ctChange" class="ct-chg">—</span>
      <div class="seg" id="intervalSeg"></div>
      <div class="seg toggles" id="toggleSeg">
        <button data-t="TURTLE" class="on">터틀</button>
        <button data-t="ADX" class="on">ADX</button>
        <button data-t="TSMOM" class="on">TSMOM</button>
        <button data-t="QQQ" class="on" title="QQQ 전략 (EMA / TSMOM / SMA200 / 터틀 50-20)">QQQ</button>
        <button data-t="stops" class="on">손절선</button>
        <button data-t="markers" class="on">매매표시</button>
        <button data-t="sma" class="on">SMA200</button>
        <button data-t="channel">채널</button>
      </div>
      <span id="ctLegend" class="legend"></span>
    </div>
    <div id="chartWrap"><div id="chart"></div><div id="chartMsg"></div></div>
    <div id="summary">
      <div class="sum-block">
        <div class="panel-h">전략 요약 <span id="sumCtl"></span><span class="muted" id="sumMode"></span></div>
        <table class="t compact" id="stratSumTable"></table>
      </div>
      <div class="sum-block narrow">
        <div class="panel-h">계좌</div>
        <table class="t compact kv" id="acctTable"></table>
      </div>
    </div>
  </section>

  <aside id="right" class="panel">
    <div class="panel-h">시세 정보 <span id="rSym" class="muted"></span></div>
    <table class="t compact kv" id="mktTable"></table>
    <div class="panel-h sub">전략 상태</div>
    <div id="stratStatus"></div>
    <div class="panel-h sub">호가</div>
    <div id="orderBook"></div>
  </aside>
</main>

<section id="bottom" class="panel">
  <div class="tabs" id="tabs">
    <button data-tab="positions" class="on">보유 포지션 <b id="cntPos">0</b></button>
    <button data-tab="orders">주문 <b id="cntOrd">0</b></button>
    <button data-tab="trades">거래 내역 <b id="cntTrd">0</b></button>
    <button data-tab="strategies">전략 설정</button>
    <button data-tab="scheduler">신호 일정·기록</button>
    <button data-tab="controller">자동 조절 <b id="cntCtl">0</b></button>
    <button data-tab="log">시스템 로그 <b id="cntErr" class="err">0</b></button>
    <div class="tabs-right">
      <span id="tabHint" class="muted"></span>
      <button id="btnMax" class="btn ghost small" title="패널 크게 보기">⤢</button>
    </div>
  </div>
  <div id="tabBody">
    <div class="tab-pane on" id="tab-positions"></div>
    <div class="tab-pane" id="tab-orders"></div>
    <div class="tab-pane" id="tab-trades"></div>
    <div class="tab-pane" id="tab-strategies"></div>
    <div class="tab-pane" id="tab-scheduler"></div>
    <div class="tab-pane" id="tab-controller"></div>
    <div class="tab-pane" id="tab-log">
      <div class="log-bar" id="logBar">
        <button data-f="ALL" class="on">전체</button><button data-f="TRADE">매매</button><button data-f="WARN">경고</button><button data-f="ERROR">오류</button>
        <label><input type="checkbox" id="logAuto" checked> 자동 스크롤</label>
      </div>
      <div id="logList"></div>
    </div>
  </div>
</section>

<section id="portfolio" class="hidden"></section>
<section id="backtest" class="hidden"></section>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toasts"></div>

<script src="/vendor/lightweight-charts.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
