<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HIC Trading Terminal</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="/css/terminal.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><b>HIC</b><span>FUTURES TERMINAL</span></div>

  <div class="mode-block">
    <div id="modeBadge" class="mode-badge paper">PAPER</div>
    <div id="runBadge" class="run-badge stopped">STOPPED</div>
    <div class="mode-switch" id="modeSwitch">
      <button data-mode="PAPER">PAPER</button><button data-mode="LIVE">LIVE</button>
    </div>
  </div>

  <div class="kpi-main">
    <div class="kpi xl"><label>Total Equity <i id="kEqCcy">USDT</i></label><div id="kEquity">—</div></div>
    <div class="kpi xl"><label>Today's PnL <i>UTC 00:00</i></label><div id="kToday">—</div><small id="kTodayPct"></small></div>
    <div class="kpi xl"><label>Total Return</label><div id="kReturn">—</div><small id="kBase"></small></div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><label>Available</label><div id="kAvail">—</div></div>
    <div class="kpi"><label>Invested</label><div id="kInvested">—</div></div>
    <div class="kpi"><label>Total PnL</label><div id="kTotalPnl">—</div></div>
    <div class="kpi"><label>Long Exp.</label><div id="kLong" class="up">—</div></div>
    <div class="kpi"><label>Short Exp.</label><div id="kShort" class="down">—</div></div>
    <div class="kpi"><label>Net Exp.</label><div id="kNet">—</div></div>
  </div>

  <div class="status-grid">
    <div><label>Data</label><span id="sMarket" class="dot">—</span></div>
    <div><label>API</label><span id="sExchange" class="dot">—</span></div>
    <div><label>Bot</label><span id="sBot" class="dot">—</span></div>
    <div><label>Updated</label><span id="sLast">—</span></div>
  </div>

  <div class="actions">
    <button id="btnStart" class="btn start">▶ START</button>
    <button id="btnStop" class="btn stop">■ STOP ALL BOTS</button>
    <button id="btnCloseAll" class="btn danger">CLOSE ALL POSITIONS</button>
    <button id="btnApi" class="btn ghost" title="Binance API Key">⚙ API KEY</button>
  </div>
</header>

<main id="grid">
  <aside id="watchlist" class="panel">
    <div class="panel-h">WATCHLIST <span class="muted">USDT-M PERP</span></div>
    <div id="wlBody"></div>
    <div class="panel-h sub">EXPOSURE BY COIN</div>
    <table class="t compact" id="expTable"></table>
  </aside>

  <section id="center">
    <div id="chartToolbar">
      <span id="ctSymbol" class="ct-sym">BTCUSDT</span>
      <span id="ctPrice" class="ct-price">—</span>
      <span id="ctChange" class="ct-chg">—</span>
      <div class="seg" id="intervalSeg"></div>
      <div class="seg toggles" id="toggleSeg">
        <button data-t="TURTLE" class="on">TURTLE</button>
        <button data-t="ADX" class="on">ADX</button>
        <button data-t="TSMOM" class="on">TSMOM</button>
        <button data-t="stops" class="on">STOPS</button>
        <button data-t="markers" class="on">TRADES</button>
        <button data-t="sma" class="on">SMA200</button>
        <button data-t="channel">20D CH</button>
      </div>
      <span id="ctLegend" class="legend"></span>
    </div>
    <div id="chartWrap"><div id="chart"></div><div id="chartMsg"></div></div>
    <div id="summary">
      <div class="sum-block">
        <div class="panel-h">STRATEGY SUMMARY <span class="muted" id="sumMode"></span></div>
        <table class="t compact" id="stratSumTable"></table>
      </div>
      <div class="sum-block narrow">
        <div class="panel-h">ACCOUNT</div>
        <table class="t compact kv" id="acctTable"></table>
      </div>
    </div>
  </section>

  <aside id="right" class="panel">
    <div class="panel-h">MARKET <span id="rSym" class="muted"></span></div>
    <table class="t compact kv" id="mktTable"></table>
    <div class="panel-h sub">STRATEGY STATUS</div>
    <div id="stratStatus"></div>
    <div class="panel-h sub">ORDER BOOK</div>
    <div id="orderBook"></div>
  </aside>
</main>

<section id="bottom" class="panel">
  <div class="tabs" id="tabs">
    <button data-tab="positions" class="on">Positions <b id="cntPos">0</b></button>
    <button data-tab="orders">Orders <b id="cntOrd">0</b></button>
    <button data-tab="trades">Trades <b id="cntTrd">0</b></button>
    <button data-tab="strategies">Strategies</button>
    <button data-tab="log">System Log <b id="cntErr" class="err">0</b></button>
    <div class="tabs-right">
      <span id="tabHint" class="muted"></span>
      <button id="btnMax" class="btn ghost small" title="Expand panel">⤢</button>
    </div>
  </div>
  <div id="tabBody">
    <div class="tab-pane on" id="tab-positions"></div>
    <div class="tab-pane" id="tab-orders"></div>
    <div class="tab-pane" id="tab-trades"></div>
    <div class="tab-pane" id="tab-strategies"></div>
    <div class="tab-pane" id="tab-log">
      <div class="log-bar" id="logBar">
        <button data-f="ALL" class="on">ALL</button><button data-f="TRADE">TRADE</button><button data-f="WARN">WARN</button><button data-f="ERROR">ERROR</button>
        <label><input type="checkbox" id="logAuto" checked> auto-scroll</label>
      </div>
      <div id="logList"></div>
    </div>
  </div>
</section>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toasts"></div>

<script src="/vendor/lightweight-charts.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
